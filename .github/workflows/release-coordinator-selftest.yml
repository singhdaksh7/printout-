# Tests for the release coordinator itself. Read-only, no secrets, never deploys.
name: Release coordinator self-test

on:
  pull_request:
    paths: ['.github/release/**', '.github/workflows/release-coordinator*.yml', '.github/rulesets/**']

permissions:
  contents: read

jobs:
  selftest:
    name: Coordinator unit tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: node --test .github/release/gate.test.mjs
      - name: Shell syntax
        run: for f in .github/release/*.sh; do bash -n "$f"; done
      - name: shellcheck (errors only)
        run: shellcheck --severity=error .github/release/*.sh
