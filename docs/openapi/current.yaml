openapi: 3.0.3
info:
  title: Printout API (current, verified)
  version: 0.1.0
  description: |
    Routes that exist today in apps/api. Field-level request and response details are in docs/API_CONTRACT.md; this file
    records paths, methods, auth and envelopes only, so it never claims more than the code does. Target-architecture
    routes that are not implemented are listed in docs/API_TARGET_SPEC.md and are deliberately absent here.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: "Liveness"
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /ready:
    get:
      summary: "Readiness (database)"
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: "Public shop profile and rates"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/uploads/initiate:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: "Start an upload (signed content URL)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/uploads/{uploadId}/content:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    put:
      summary: "Upload bytes (token query parameter)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/uploads/{uploadId}/complete:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      summary: "Finish upload; server validates type and counts pages"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/quotes:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: "Server-priced quote"
      security: []
