openapi: 3.0.3
info:
  title: Printout API (current, verified)
  version: 0.1.0
  description: |
    Routes that exist today in apps/api. Field-level request and response details are in docs/API_CONTRACT.md; this file
    records paths, methods, auth and envelopes only, so it never claims more than the code does. Target-architecture
    routes that are not implemented are listed in docs/API_TARGET_SPEC.md and are deliberately absent here.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: "Liveness"
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /ready:
    get:
      summary: "Readiness (database)"
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: "Public shop profile and rates; includes server-computed availability (open/closed/unknown, next opening, weekly hours)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/uploads/initiate:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: "Start an upload (signed content URL)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/uploads/{uploadId}/content:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    put:
      summary: "Upload bytes (token query parameter)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/uploads/{uploadId}/complete:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      summary: "Finish upload; server validates type and counts pages"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/quotes:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: "Server-priced quote"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/shops/{slug}/orders:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: "Create order (clientRequestId idempotent)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /public/orders/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: "Order tracking by token"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/login:
    post:
      summary: "Password login (owner or admin). An admin with 2FA enabled receives { twoFactorRequired: true } and a pending-challenge cookie instead of a session"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/login/2fa:
    post:
      summary: "Second step of an admin sign-in (needs the printout_2fa pending-challenge cookie from /auth/login); issues the session only after a valid, unused TOTP or recovery code"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [method, code], properties: { method: { type: string, enum: [totp, recovery] }, code: { type: string, minLength: 1, maxLength: 64 } } }
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope: 401 INVALID_TWO_FACTOR_CODE, 401 TWO_FACTOR_CHALLENGE_INVALID, 429 RATE_LIMITED, 503 TWO_FACTOR_UNAVAILABLE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/login/2fa/cancel:
    post:
      summary: "Abandon the pending second-factor sign-in (204)"
      security: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/logout:
    post:
      summary: "Logout"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/session:
    get:
      summary: "Current session"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders:
    get:
      summary: "List orders (cursor)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/history:
    get:
      summary: "Order history (IST day range, search, cursor; metadata only)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (CSV body for export.csv)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/history/summary:
    get:
      summary: "Order history summary counts"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (CSV body for export.csv)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/history/export.csv:
    get:
      summary: "Order history CSV export (metadata only, formula-safe, rate-limited)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (CSV body for export.csv)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/analytics/revenue:
    get:
      summary: "Order value report: ESTIMATED order value from stored quotes (not payments); IST day range, comparison, daily series, breakdowns"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/analytics/revenue/export.csv:
    get:
      summary: "Order value CSV export (quoted values only, formula-safe, rate-limited, max 5000 rows)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'CSV body', content: { text/csv: { schema: { type: string } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: "Order detail"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}/transitions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Cancel an order (only CANCELLED accepted)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}/print-now:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Start print and retention; returns document access"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}/print-confirmation:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Legacy print confirmation"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}/document-access:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Short-lived inline document URL"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/orders/{id}/document-download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Short-lived download URL (Save file)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/settings:
    get:
      summary: "Shop settings"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    put:
      summary: "Update settings (allow-listed fields)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/hours:
    get:
      summary: "Operating hours, closures, policy and current availability"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    put:
      summary: "Update timezone, weekly hours (null removes), special closures, after-hours policy"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/hours/temporary-closure:
    put:
      summary: "Close the shop now (reason, optional until)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    delete:
      summary: "Clear temporary closure"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/hours/reopen:
    post:
      summary: "Emergency reopen for 5..1440 minutes"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    delete:
      summary: "End emergency reopen"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope (SHOP_CLOSED 409 on public upload/quote/order when closed and policy is BLOCK)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/pricing-rules:
    get:
      summary: "List pricing rules"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    post:
      summary: "Create rule"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/pricing-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: "Update rule"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    delete:
      summary: "Delete rule"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/qr:
    get:
      summary: "Public URL for the counter QR"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/analytics:
    get:
      summary: "Counts for a range"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/events:
    get:
      summary: "Server-Sent Events for the shop (also streams notification.created)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/notifications:
    get:
      summary: "Durable shop notifications, newest first (cursor / after / limit / unreadOnly)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: { items, nextCursor, hasMore, latestCursor, unreadCount } }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/notifications/read-all:
    post:
      summary: "Mark every notification of the shop as read"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: { updated, unreadCount } }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Mark one notification as read (404 for another shop's id)"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: { notification, unreadCount } }', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/devices:
    get:
      summary: "List paired devices"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/devices/pairing-codes:
    post:
      summary: "Create one-time pairing code"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: "Rename device"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /shop/devices/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: "Disconnect device"
      security:
        - ownerSession: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /device/pair:
    post:
      summary: "Exchange pairing code for a device credential"
      security: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /device/me:
    get:
      summary: "Device identity"
      security:
        - deviceBearer: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /device/heartbeat:
    post:
      summary: "Presence heartbeat"
      security:
        - deviceBearer: []
      responses:
        '200': { description: 'Success: { data: ... } (201 or 204 where the contract says so)', content: { application/json: { schema: { $ref: '#/components/schemas/DataEnvelope' } } } }
        default: { description: 'Error envelope', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /device/push-token:
    put:
      summary: "Register push token"
      security:
