components:
  securitySchemes:
    ownerSession: { type: apiKey, in: cookie, name: printout_session, description: "Shop owner session plus CSRF token header on mutations" }
    adminSession: { type: apiKey, in: cookie, name: printout_session, description: "Platform admin session plus CSRF token header on mutations" }
    deviceBearer: { type: http, scheme: bearer }
    mobileBearer: { type: http, scheme: bearer, description: "Opaque access token from POST /auth (mobile, 15 min by default). No CSRF header is needed for bearer calls. Renew with POST /auth/refresh." }
    restrictedBearer: { type: http, scheme: bearer, description: "Restricted access token of a verified identity with no account yet; accepted only by GET /users/me, POST /shops/onboarding and POST /auth/logout." }
  schemas:
    DataEnvelope: { type: object, required: [data], properties: { data: {} } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties: { code: { type: string }, message: { type: string }, requestId: { type: string }, details: {} }
