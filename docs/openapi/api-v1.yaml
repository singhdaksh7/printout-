      type: http
      scheme: bearer
      description: Device credential `pbd_<43 chars>` issued once by POST /device/pair.
    cookieAuth:
      type: apiKey
      in: cookie
      name: printout_session
      description: Web session cookie (HttpOnly, path /api/v1).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with cookieAuth on POST/PUT/PATCH/DELETE. Not used with bearerAuth.
