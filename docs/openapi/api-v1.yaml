openapi: 3.0.3
info:
  title: Printout Buddy API v1
  version: 1.0.0-main-080c6bd
  description: >-
    Complete route inventory of the Printout Buddy backend as registered in apps/api on origin/main (080c6bd). Generated from the same
    verified table as docs/architecture/api-inventory.md; every operation carries x-verification. Schemas are transcribed from source;
    shapes marked `any` are not pinned by a schema in code. Supersedes the path-only docs/openapi/current.yaml for integration work.
servers:
  - url: https://printoutbuddy.tech/api/v1
    description: Production
tags:
  - name: 1. Authentication and onboarding
  - name: 2. User profile
  - name: 3. Shop settings
  - name: 4. Shop pricing and quotes
  - name: 5. Shop orders and live queue
  - name: 6. Printing and devices
  - name: 7. Notifications / FCM
  - name: 8. Analytics
  - name: 9. Customer public APIs
  - name: 10. Admin-only APIs
  - name: 11. Operations (not part of the product API)
paths:
  /auth:
    post:
      operationId: postAuth
      tags:
        - 1. Authentication and onboarding
      summary: Unified MOBILE sign-in. Exchanges a Firebase Google/phone ID token (or email+password) for a Bearer access…
      description: >-
        Unified MOBILE sign-in. Exchanges a Firebase Google/phone ID token (or email+password) for a Bearer access token + rotating refresh
        token.


        `firebaseIdToken` (20-4096 chars) required for `otp` and `google`; `email`+`password` required for `email`. `installationId` = 16-64
        chars `[A-Za-z0-9_-]`, random and stable per install. `fcmToken` is optional, registered only after authentication succeeds, and a
        push failure never fails sign-in. Body is strict (unknown keys → 400).


        A Google identity not linked to any account returns the **restricted pair** with `nextStep: "create_shop"` and `user.id: null`; use
        it only for `POST /shops/onboarding`, `GET /users/me` and logout.


        Idempotency: Not idempotent: each success revokes earlier token families of the same `installationId` and issues a new pair. A
        Firebase ID token can be exchanged once (replay protection on `auth_time`).


        Rate limit: `LOGIN_RATE_LIMIT_MAX` = 10/min per IP; plus in-memory failed-login throttles (5 per IP+email / 15 min; account-wide
        20).


        Tables read: User, Shop, UserGoogleIdentity, UserPhoneIdentity, ShopSettings, Subscription, Plan, PricingRule, AuditLog. Written:
        Session, RefreshToken, PhoneOnboardingGrant (new identity), FcmRegistration (optional), UserGoogleIdentity/UserPhoneIdentity
        (lastAuthTime), User.lastLoginAt, AuditLog.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginMethod:
                  type: string
                  enum:
                    - otp
                    - email
                    - google
                phoneNumber:
                  type: string
                firebaseIdToken:
                  type: string
                email:
                  type: string
                password:
                  type: string
                fcmToken:
                  type: string
                installationId:
                  type: string
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
              required:
                - loginMethod
                - installationId
                - platform
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileAuthResponse'
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: INVALID_CREDENTIALS (email); GOOGLE_TOKEN_INVALID; PHONE_TOKEN_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Error codes: FORBIDDEN (admin or non-owner); ACCOUNT_BLOCKED (suspended shop, `details.nextStep=account_blocked`);
            PHONE_REVERIFY_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error codes: GOOGLE_LOGIN_UNAVAILABLE; PHONE_LOGIN_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'YES: the only Android sign-in endpoint.'
      x-auth: None
      x-tables-read:
        - User
        - Shop
        - UserGoogleIdentity
        - UserPhoneIdentity
        - ShopSettings
        - Subscription
        - Plan
        - PricingRule
        - AuditLog
      x-tables-written:
        - Session
        - RefreshToken
        - PhoneOnboardingGrant (new identity)
        - FcmRegistration (optional)
        - UserGoogleIdentity/UserPhoneIdentity (lastAuthTime)
        - User.lastLoginAt
        - AuditLog
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
        - 1. Authentication and onboarding
      summary: 'Rotate the refresh token: returns a new access token AND a new refresh token (single-use rotation with…'
      description: >-
        Rotate the refresh token: returns a new access token AND a new refresh token (single-use rotation with reuse detection).


        `deviceId` must equal the `installationId` used at sign-in (16-64 chars). Body limit 4096 bytes; anything larger returns the same
        401 as a forged token. Refresh token travels ONLY in the body.


        A restricted (onboarding) refresh token stays restricted until the identity is linked to a user; the next refresh after onboarding
        yields a normal pair. 15 min access / 30 day refresh are the code defaults (`ACCESS_TOKEN_TTL_MINUTES`, `REFRESH_TOKEN_TTL_DAYS`);
        trust `expiresIn` / `refreshTokenExpiresIn` in the response.


        Idempotency: Single-use. Re-presenting a rotated token within `REFRESH_REUSE_GRACE_SECONDS` (5) → 409 (nothing revoked); later →
        whole family revoked + 401. Always single-flight on the client.


        Rate limit: 30/min per IP (`LOGIN_RATE_LIMIT_MAX*3`), per-family budget 60, failure throttle per IP.


        Tables read: RefreshToken, User, Shop, UserPhoneIdentity, UserGoogleIdentity. Written: RefreshToken (rotatedAt / new row), Session
        (old invalidated, new created), AuditLog.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
              required:
                - refreshToken
                - deviceId
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MobileAuthResponse'
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: REFRESH_TOKEN_INVALID; REFRESH_TOKEN_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: ACCOUNT_BLOCKED; FORBIDDEN'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Error codes: REFRESH_CONFLICT (concurrent/just-rotated, retry after the first finishes)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'YES'
      x-auth: None
      x-tables-read:
        - RefreshToken
        - User
        - Shop
        - UserPhoneIdentity
        - UserGoogleIdentity
      x-tables-written:
        - RefreshToken (rotatedAt / new row)
        - Session (old invalidated, new created)
        - AuditLog
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
        - 1. Authentication and onboarding
      summary: End this session. For a mobile session also revokes its refresh family and the installation's FCM…
      description: >-
        End this session. For a mobile session also revokes its refresh family and the installation's FCM registration.


        Body optional. An expired-access-token app can still sign out by sending `{ refreshToken }` with no Authorization header
        (idempotent: unknown/revoked token → 204).


        Idempotency: Idempotent.


        Rate limit: shopMutation 60/min per session.


        Tables read: Session, RefreshToken, PhoneOnboardingGrant. Written: Session.invalidatedAt, RefreshToken.revokedAt, FcmRegistration
        (revoked), PhoneOnboardingGrant (deleted), AuditLog.
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfHeader: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: No Content
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: UNAUTHORIZED (no valid credential at all)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: CSRF_INVALID (cookie)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'YES'
      x-auth: Session, or refresh token in body
      x-tables-read:
        - Session
        - RefreshToken
        - PhoneOnboardingGrant
      x-tables-written:
        - Session.invalidatedAt
        - RefreshToken.revokedAt
        - FcmRegistration (revoked)
        - PhoneOnboardingGrant (deleted)
        - AuditLog
  /auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      tags:
        - 1. Authentication and onboarding
      summary: 'Sign out of every device: ends all sessions and refresh families of the caller; removes push registrations…'
      description: |-
        Sign out of every device: ends all sessions and refresh families of the caller; removes push registrations unless `keepPush`.

        Idempotency: Idempotent.

        Rate limit: shopMutation 60/min per session.

        Tables read: Session, RefreshToken. Written: Session, RefreshToken, FcmRegistration, AuditLog.
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keepPush:
                  type: boolean
      responses:
        '204':
          description: No Content
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: FORBIDDEN; SHOP_SUSPENDED; CSRF_INVALID (cookie transport only)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'YES'
      x-auth: Any session
      x-tables-read:
        - Session
        - RefreshToken
      x-tables-written:
        - Session
        - RefreshToken
        - FcmRegistration
        - AuditLog
  /auth/session:
    get:
      operationId: getAuthSession
      tags:
        - 1. Authentication and onboarding
      summary: 'Web session probe: returns the web-shaped session payload including a fresh CSRF token.'
      description: |-
        Web session probe: returns the web-shaped session payload including a fresh CSRF token.

        Idempotency: Safe (GET).

        Rate limit: shopRead 600/min per session.

        Tables read: Session, User, Shop. Written: —.
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          displayName:
                            type: string
                          role:
                            type: string
                            enum:
                              - SHOP_OWNER
                              - PLATFORM_ADMIN
                        required:
                          - id
                          - displayName
                          - role
                      shop:
                        type: object
                        properties:
                          id:
                            type: string
                          slug:
                            type: string
                          displayName:
                            type: string
                        required:
                          - id
                          - slug
                          - displayName
                        nullable: true
                      csrfToken:
                        type: string
                      retentionMinutes:
                        type: integer
                    required:
                      - user
                      - shop
                      - csrfToken
                      - retentionMinutes
                required:
                  - data
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: FORBIDDEN; SHOP_SUSPENDED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'NO: use `GET /users/me` (richer, same auth).'
      x-auth: Any session
      x-tables-read:
        - Session
        - User
        - Shop
      x-tables-written: []
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
        - 1. Authentication and onboarding
      summary: 'WEB email+password sign-in (cookie session + CSRF token). Admins with 2FA get `{ twoFactorRequired: true…'
      description: >-
        WEB email+password sign-in (cookie session + CSRF token). Admins with 2FA get `{ twoFactorRequired: true }` plus a pending-challenge
        cookie instead of a session.


        Idempotency: Not idempotent: rotates the cookie session.


        Rate limit: 10/min per IP + failed-login throttle.


        Tables read: User, Shop, AdminTwoFactor. Written: Session, AdminLoginChallenge, User.lastLoginAt, AuditLog.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          displayName:
                            type: string
                          role:
                            type: string
                            enum:
                              - SHOP_OWNER
                              - PLATFORM_ADMIN
                        required:
                          - id
                          - displayName
                          - role
                      shop:
                        type: object
                        properties:
                          id:
                            type: string
                          slug:
                            type: string
                          displayName:
                            type: string
                        required:
                          - id
                          - slug
                          - displayName
                        nullable: true
                      csrfToken:
                        type: string
                      retentionMinutes:
                        type: integer
                    required:
                      - user
                      - shop
                      - csrfToken
                      - retentionMinutes
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: INVALID_CREDENTIALS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: SHOP_SUSPENDED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error codes: TWO_FACTOR_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'NO: sets a cookie and returns a CSRF token. Use `POST /auth` with `loginMethod: "email"`.'
      x-auth: None
      x-tables-read:
        - User
        - Shop
        - AdminTwoFactor
      x-tables-written:
        - Session
        - AdminLoginChallenge
        - User.lastLoginAt
        - AuditLog
  /auth/login/2fa:
    post:
      operationId: postAuthLogin2fa
      tags:
        - 1. Authentication and onboarding
      summary: Second step of an admin sign-in (TOTP or recovery code).
      description: >-
        Second step of an admin sign-in (TOTP or recovery code).


        Idempotency: Challenge is single-use; each attempt is counted before the code is checked (max 5).


        Rate limit: 10/min per IP.


        Tables read: AdminLoginChallenge, AdminTwoFactor, AdminRecoveryCode, User. Written: AdminLoginChallenge,
        AdminTwoFactor.lastUsedStep, AdminRecoveryCode.usedAt, Session, AuditLog.
      security:
        - challengeCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - totp
                    - recovery
                code:
                  type: string
              required:
                - method
                - code
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: {}
                      shop:
                        nullable: true
                      csrfToken:
                        type: string
                      retentionMinutes:
                        type: integer
                      recoveryCodesRemaining:
                        type: integer
                    required:
                      - user
                      - shop
                      - csrfToken
                      - retentionMinutes
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: INVALID_TWO_FACTOR_CODE; TWO_FACTOR_CHALLENGE_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error codes: TWO_FACTOR_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: NO (admin web only)
      x-auth: Pending 2FA challenge cookie
      x-tables-read:
        - AdminLoginChallenge
        - AdminTwoFactor
        - AdminRecoveryCode
        - User
      x-tables-written:
        - AdminLoginChallenge
        - AdminTwoFactor.lastUsedStep
        - AdminRecoveryCode.usedAt
        - Session
        - AuditLog
  /auth/login/2fa/cancel:
    post:
      operationId: postAuthLogin2faCancel
      tags:
        - 1. Authentication and onboarding
      summary: Abandon a pending admin 2FA challenge held by this browser.
      description: |-
        Abandon a pending admin 2FA challenge held by this browser.

        Idempotency: Idempotent.

        Rate limit: none beyond global.

        Tables read: AdminLoginChallenge. Written: AdminLoginChallenge.consumedAt.
      security: []
      responses:
        '204':
          description: No Content
      x-verification: Verified from code
      x-android: NO (admin web only)
      x-auth: None
      x-tables-read:
        - AdminLoginChallenge
      x-tables-written:
        - AdminLoginChallenge.consumedAt
  /auth/google/session:
    post:
      operationId: postAuthGoogleSession
      tags:
        - 1. Authentication and onboarding
      summary: 'WEB Google sign-in: verified Firebase Google ID token → session cookie, or restricted onboarding cookie…'
      description: |-
        WEB Google sign-in: verified Firebase Google ID token → session cookie, or restricted onboarding cookie when no account is linked.

        Idempotency: Token single-use (`auth_time` replay check).

        Rate limit: 10/min per IP + failure throttle.

        Tables read: UserGoogleIdentity, User, Shop. Written: Session, PhoneOnboardingGrant, UserGoogleIdentity.lastAuthTime, AuditLog.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
              required:
                - idToken
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: GOOGLE_TOKEN_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: FORBIDDEN (bad Origin / admin); SHOP_SUSPENDED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error codes: GOOGLE_LOGIN_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'NO: use `POST /auth` (`loginMethod: "google"`).'
      x-auth: None
      x-tables-read:
        - UserGoogleIdentity
        - User
        - Shop
      x-tables-written:
        - Session
        - PhoneOnboardingGrant
        - UserGoogleIdentity.lastAuthTime
        - AuditLog
  /auth/phone/session:
    post:
      operationId: postAuthPhoneSession
      tags:
        - 1. Authentication and onboarding
      summary: WEB phone-OTP sign-in for an already-linked owner (cookie session). Does NOT create onboarding grants.
      description: |-
        WEB phone-OTP sign-in for an already-linked owner (cookie session). Does NOT create onboarding grants.

        Idempotency: Token single-use.

        Rate limit: 10/min per IP.

        Tables read: UserPhoneIdentity, User, Shop. Written: Session, UserPhoneIdentity.lastAuthTime, AuditLog.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
              required:
                - idToken
      responses:
        '200':
          description: Success (200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
                required:
                  - data
        '400':
          description: 'Error codes: VALIDATION_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Error codes: PHONE_TOKEN_INVALID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Error codes: PHONE_NOT_LINKED; PHONE_REVERIFY_REQUIRED; SHOP_SUSPENDED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Error codes: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Error codes: PHONE_LOGIN_UNAVAILABLE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-verification: Verified from code
      x-android: 'NO: use `POST /auth` (`loginMethod: "otp"`).'
      x-auth: None
      x-tables-read:
        - UserPhoneIdentity
        - User
        - Shop
      x-tables-written:
        - Session
        - UserPhoneIdentity.lastAuthTime
        - AuditLog
  /auth/phone/config:
    get:
      operationId: getAuthPhoneConfig
      tags:
        - 1. Authentication and onboarding
      summary: Phone sign-in availability and allowed country codes.
      description: |-
        Phone sign-in availability and allowed country codes.

