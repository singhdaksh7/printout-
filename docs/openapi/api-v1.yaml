      description: >-
        Local-storage driver only: serves a stored document for a signed URL (`exp`, `sig`, `dl`). With the S3 driver, URLs point at the
        object store instead.


        Idempotency: Safe; DB row re-checked each request.


        Rate limit: —


        Tables read: Document, Local object storage. Written: —.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: exp
          in: query
          required: true
          schema:
            type: string
        - name: sig
          in: query
          required: true
          schema:
            type: string
        - name: dl
          in: query
          required: false
          description: 1 = attachment
          schema:
            type: string
