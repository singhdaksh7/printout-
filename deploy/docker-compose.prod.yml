# Production stack for ONE small VPS (1-2 GB RAM). Run from anywhere (deploy/deploy.sh wraps this):
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d
#
# Network layout (only Caddy publishes ports 80/443; nothing else has `ports:`):
#   edge     caddy <-> web, api                      (default bridge)
#   backend  api, worker, migrate <-> postgres       (internal: true  => no route to the internet, postgres is unreachable from outside)
#   egress   worker only: outbound access to the S3/R2 endpoint for deletions (api gets egress through `edge`)
# Hardening on every service: no-new-privileges, cap_drop ALL (+ the minimum add-backs noted inline), read_only root
# filesystem with tmpfs for scratch, memory/CPU/pid limits, json-file log rotation. No docker socket, no privileged.
name: printout

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

x-api-env: &api-env
  env_file:
    # Override with PRINTOUT_ENV_FILE=/abs/path (deploy.sh does this from ENV_FILE). Relative = this directory.
    - ${PRINTOUT_ENV_FILE:-.env.production}
  environment: &api-environment
    NODE_ENV: production
    # Caddy is the only client of the API on the edge network and OVERWRITES X-Forwarded-For with the real peer address.
    # Trust only private (docker bridge) hops, so a client-supplied X-Forwarded-For can never become its "IP".
    TRUST_PROXY_CIDRS: loopback,linklocal,uniquelocal
    API_PORT: "3000"
    # Derived here so the DB password lives in exactly one place. POSTGRES_PASSWORD must be URL-safe
    # (use `openssl rand -hex 24`). connection_limit keeps Prisma pools small for a 40-connection Postgres.
    DATABASE_URL: postgresql://printout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/printout?schema=public&connection_limit=5

services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # The official entrypoint starts as root, chowns the data dir and drops to `postgres` via gosu: it needs these five.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_USER: printout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: printout
    # Tuned for a ~1-2 GB VPS. No `ports:` on purpose: never expose Postgres publicly.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=512MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printout -d printout"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          pids: 200
          memory: 384M
          cpus: "1.0"
    networks: [backend]

  migrate:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    <<: [*api-env, *hardening]
    restart: "no"
    logging: *default-logging
    # One-shot `prisma migrate deploy` (forward-only). Needs only the DB: backend network, no internet.
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          pids: 200
          memory: 384M
    networks: [backend]

  api:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    # The ONE build definition for the API image; migrate and worker reuse the same image tag (`deploy.sh` builds api + web).
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    <<: [*api-env, *hardening]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    volumes:
      # Only used when STORAGE_DRIVER=local (NOT for production at scale; never back this up). Empty with s3.
      - uploads-local:/data/uploads
    # healthcheck = image HEALTHCHECK (GET /health, liveness only; /ready also checks the DB for external monitors).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          pids: 200
          memory: 512M
          cpus: "1.0"
    networks: [edge, backend]

  worker:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    <<: [*api-env, *hardening]
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true # image HEALTHCHECK targets the HTTP server, which the worker does not run (watch its logs)
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    volumes:
      - uploads-local:/data/uploads
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          pids: 100
          memory: 256M
          cpus: "0.5"
    # backend: postgres. egress: reach the S3/R2 endpoint to delete expired objects.
    networks: [backend, egress]

  web:
    image: ${PRINTOUT_WEB_IMAGE:-printout-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    # nginx runs as the unprivileged `nginx` user on :8080 (see apps/web/Dockerfile); scratch dirs are tmpfs.
    tmpfs:
      - /tmp
      - /var/cache/nginx:mode=1777
    deploy:
      resources:
        limits:
          pids: 100
          memory: 64M
          cpus: "0.5"
    networks: [edge]

  caddy:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # bind 80/443 inside the container
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the env file}
      # Must be >= UPLOAD_MAX_BYTES + 1 MiB (default 52428800 + 1048576). deploy.sh checks this.
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-53477376}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API listens on localhost:2019 inside the container only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          pids: 200
          memory: 128M
          cpus: "0.5"
    networks: [edge] # edge is a normal bridge: outbound ACME/OCSP works

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  uploads-local:
