# Production stack for ONE small VPS (1-2 GB RAM). Run from the repo root:
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d
# (deploy/deploy.sh wraps this.) Only Caddy publishes ports (80/443). Postgres, API and web are
# reachable on the internal compose network only.
name: printout

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  env_file:
    - .env.production
  environment: &api-environment
    NODE_ENV: production
    TRUST_PROXY: "true" # Caddy is the only thing that can reach the API; trust its X-Forwarded-For
    API_PORT: "3000"
    # Derived here so the DB password lives in exactly one place. POSTGRES_PASSWORD must be URL-safe
    # (use `openssl rand -hex 24`). connection_limit keeps Prisma pools small for a 50-connection Postgres.
    DATABASE_URL: postgresql://printout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/printout?schema=public&connection_limit=5

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: printout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: printout
    # Tuned for a ~1-2 GB VPS. No `ports:` on purpose: never expose Postgres publicly.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=512MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printout -d printout"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [internal]

  migrate:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    <<: *api-env
    restart: "no"
    logging: *default-logging
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    <<: *api-env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Only used when STORAGE_DRIVER=local (NOT for production at scale; never back this up).
      - uploads-local:/data/uploads
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [internal]

  worker:
    image: ${PRINTOUT_API_IMAGE:-printout-api:local}
    <<: *api-env
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true # image HEALTHCHECK targets the HTTP server, which the worker does not run
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads-local:/data/uploads
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [internal]

  web:
    image: ${PRINTOUT_WEB_IMAGE:-printout-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  uploads-local:
