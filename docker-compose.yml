services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: printout
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: printout
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - printout-postgres:/var/lib/postgresql/data
  # Optional local S3 for testing STORAGE_DRIVER=s3:  docker compose --profile s3 up -d minio
  # Console http://localhost:9001 (create bucket printout-documents). Dev only.
  minio:
    image: minio/minio
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-me-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - printout-minio:/data
volumes:
  printout-postgres:
  printout-minio:
